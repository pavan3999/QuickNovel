name: Build App

on:
  # Manual triggers
  workflow_dispatch:
    inputs:
      git-ref:
        description: Git Ref (Optional)
        required: false
      dry-run:
        description: Creates a draft release
        required: false

jobs:
  build:
    name: Build app
    runs-on: ubuntu-latest

    steps:
      - name: Cancel previous runs
        uses: styfle/cancel-workflow-action@0.5.0
        with:
          access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Clone Repository (Latest)
        uses: actions/checkout@v7
        if: github.event.inputs.git-ref == ''
        with:
          repository: 'LagradOst/QuickNovel'
          fetch-depth: 0

      - name: Clone Repository (Custom Ref)
        uses: actions/checkout@v7
        if: github.event.inputs.git-ref != ''
        with:
          repository: 'LagradOst/QuickNovel'
          fetch-depth: 0
          ref: ${{ github.event.inputs.git-ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure ARM64 only
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/build.gradle")
          text = path.read_text()

          marker = '''    defaultConfig {
              applicationId "com.lagradost.quicknovel"'''

          replacement = '''    defaultConfig {
              ndk {
                  abiFilters "arm64-v8a"
              }

              applicationId "com.lagradost.quicknovel"'''

          if marker not in text:
              raise SystemExit("Could not find defaultConfig marker")

          path.write_text(text.replace(marker, replacement, 1))
          PY

      - name: Build ARM64 Release
        run: ./gradlew assembleRelease

      - name: Rename app
        run: |
          cd app/build/outputs/apk/release
          mv app-release-unsigned.apk QuickNovel.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: QuickNovel
          path: app/build/outputs/apk/release/QuickNovel.apk
          
