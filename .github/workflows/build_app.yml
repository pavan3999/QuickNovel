name: Build App

on:
  workflow_dispatch:
    inputs:
      git-ref:
        description: Git Ref (Optional)
        required: false
      dry-run:
        description: Creates a draft release
        required: false

jobs:
  build:
    name: Build app
    runs-on: ubuntu-latest

    steps:
      - name: Cancel previous runs
        uses: styfle/cancel-workflow-action@0.13.1
        with:
          access_token: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------
      # Checkout upstream QuickNovel
      # ------------------------------------------------------------

      - name: Clone Repository (Latest)
        uses: actions/checkout@v7
        if: github.event.inputs.git-ref == ''
        with:
          repository: 'LagradOst/QuickNovel'
          fetch-depth: 0

      - name: Clone Repository (Custom Ref)
        uses: actions/checkout@v7
        if: github.event.inputs.git-ref != ''
        with:
          repository: 'LagradOst/QuickNovel'
          fetch-depth: 0
          ref: ${{ github.event.inputs.git-ref }}

      # ------------------------------------------------------------
      # Java / Gradle
      # ------------------------------------------------------------

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # ------------------------------------------------------------
      # Find latest release in YOUR repository
      # ------------------------------------------------------------

      - name: Get previous release
        id: last_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          TAG=$(gh release list \
            --repo "${{ github.repository }}" \
            --exclude-drafts \
            --exclude-pre-releases \
            --limit 100 \
            --json tagName \
            --jq '
              [.[].tagName
              | select(test("^r[0-9]+$"))
              | ltrimstr("r")
              | tonumber]
              | if length > 0 then max else 0 end
              | "r\(.)"
            ')

          echo "Latest release tag: $TAG"
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"

      - name: Debug previous release
        run: |
          echo "Release repository: ${{ github.repository }}"
          echo "Previous release tag: '${{ steps.last_release.outputs.tag_name }}'"

      # ------------------------------------------------------------
      # Determine previous upstream commit
      # ------------------------------------------------------------

      - name: Get previous upstream SHA
        id: previous_sha
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: ${{ steps.last_release.outputs.tag_name }}
        run: |
          set -e

          if [ "$PREVIOUS_TAG" = "r0" ]; then
            echo "No previous real release found."

            # First commit of upstream repository
            PREV_SHA=$(git rev-list --max-parents=0 HEAD | tail -n 1)

            echo "Using first upstream commit: $PREV_SHA"
          else
            echo "Reading upstream SHA from release $PREVIOUS_TAG"

            RELEASE_BODY=$(gh release view "$PREVIOUS_TAG" \
              --repo "${{ github.repository }}" \
              --json body \
              --jq '.body')

            PREV_SHA=$(printf '%s\n' "$RELEASE_BODY" \
              | grep -oE 'Upstream commit: `[0-9a-fA-F]+`' \
              | head -n 1 \
              | sed -E 's/.*`([0-9a-fA-F]+)`.*/\1/')

            if [ -z "$PREV_SHA" ]; then
              echo "ERROR: Could not find 'Upstream commit:' in $PREVIOUS_TAG."
              echo
              echo "Release body:"
              echo "$RELEASE_BODY"
              exit 1
            fi

            echo "Previous upstream SHA: $PREV_SHA"
          fi

          echo "prev_sha=$PREV_SHA" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # Current upstream build metadata
      # ------------------------------------------------------------

      - name: Prepare build metadata
        env:
          PREV_SHA: ${{ steps.previous_sha.outputs.prev_sha }}
        run: |
          set -e

          CURRENT_SHA=$(git rev-parse HEAD)
          CURRENT_SHORT_SHA=$(git rev-parse --short HEAD)

          COMMIT_COUNT=$(git rev-list --count HEAD)

          echo "CURRENT_SHA=$CURRENT_SHORT_SHA" >> "$GITHUB_ENV"
          echo "COMMIT_COUNT=$COMMIT_COUNT" >> "$GITHUB_ENV"
          echo "PREV_RELEASE_SHA=$PREV_SHA" >> "$GITHUB_ENV"

          echo "Current upstream SHA: $CURRENT_SHA"
          echo "Current short SHA: $CURRENT_SHORT_SHA"
          echo "Upstream commit count: $COMMIT_COUNT"
          echo "Previous upstream SHA: $PREV_SHA"

          echo "COMMIT_LOGS<<EOF" >> "$GITHUB_ENV"

          if [ "$PREV_SHA" = "$CURRENT_SHA" ]; then
            echo "- No upstream changes since the previous release." >> "$GITHUB_ENV"
          else
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/LagradOst/QuickNovel/compare/$PREV_SHA...$CURRENT_SHA" \
              | jq -r '
                  .commits[] |
                  "- \(.commit.message | split("\n")[0]) (@\(.author.login // "unknown"))"
                ' >> "$GITHUB_ENV"
          fi

          echo "EOF" >> "$GITHUB_ENV"

      # ------------------------------------------------------------
      # Configure ARM64-only build
      # ------------------------------------------------------------

      - name: Configure ARM64 only
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/build.gradle")
          text = path.read_text()

          marker = "defaultConfig {"

          if marker not in text:
              raise SystemExit("Could not find defaultConfig")

          text = text.replace(
              marker,
              '''defaultConfig {
                  ndk {
                      abiFilters "arm64-v8a"
                  }''',
              1
          )

          path.write_text(text)

          print("Configured ARM64-v8a only")
          PY

      - name: Verify ARM64 configuration
        run: |
          echo "Checking ARM64 configuration..."
          grep -A8 -B2 'defaultConfig' app/build.gradle

          grep -q 'abiFilters "arm64-v8a"' app/build.gradle

          echo "ARM64 configuration verified."

      # ------------------------------------------------------------
      # Build
      # ------------------------------------------------------------

      - name: Build ARM64 Release
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          ./gradlew assembleRelease

      - name: Verify unsigned APK
        run: |
          set -e

          APK="app/build/outputs/apk/release/app-release-unsigned.apk"

          test -f "$APK"

          echo "Unsigned APK found:"
          ls -lh "$APK"

      # ------------------------------------------------------------
      # Signing
      # ------------------------------------------------------------

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is not configured."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > release.jks

          test -s release.jks

          echo "Keystore decoded successfully."

      - name: Sign APK
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          INPUT_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          OUTPUT_APK="QuickNovel-arm64-v8a-r${{ env.COMMIT_COUNT }}.apk"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name apksigner \
            | sort -V \
            | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found."
            exit 1
          fi

          echo "Using apksigner:"
          echo "$APKSIGNER"

          "$APKSIGNER" sign \
            --ks release.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$OUTPUT_APK" \
            "$INPUT_APK"

          test -f "$OUTPUT_APK"

          echo "Signed APK created:"
          ls -lh "$OUTPUT_APK"

      - name: Verify signed APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          set -e

          APK="QuickNovel-arm64-v8a-r${{ env.COMMIT_COUNT }}.apk"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name apksigner \
            | sort -V \
            | tail -n 1)

          "$APKSIGNER" verify --verbose "$APK"

          echo "APK signature verified successfully."

      # ------------------------------------------------------------
      # Checksum
      # ------------------------------------------------------------

      - name: Calculate SHA-256
        run: |
          set -e

          APK="QuickNovel-arm64-v8a-r${{ env.COMMIT_COUNT }}.apk"

          SHA=$(sha256sum "$APK" | awk '{ print $1 }')

          echo "APK SHA-256:"
          echo "$SHA"

          echo "APK_ARM64_SHA=$SHA" >> "$GITHUB_ENV"

      # ------------------------------------------------------------
      # Cleanup secret material
      # ------------------------------------------------------------

      - name: Delete keystore
        if: always()
        run: |
          rm -f release.jks

      # ------------------------------------------------------------
      # Create GitHub Release
      # ------------------------------------------------------------

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: r${{ env.COMMIT_COUNT }}
          name: QuickNovel Preview r${{ env.COMMIT_COUNT }}

          body: |
            ### Upstream

            Repository: https://github.com/LagradOst/QuickNovel

            Upstream commit: `${{ env.CURRENT_SHA }}`

            Previous upstream commit: `${{ env.PREV_RELEASE_SHA }}`

            Compare:
            https://github.com/LagradOst/QuickNovel/compare/${{ env.PREV_RELEASE_SHA }}...${{ env.CURRENT_SHA }}

            ### Commits

            ${{ env.COMMIT_LOGS }}

            ---

            ### Checksums

            | Variant | SHA-256 |
            |---------|---------|
            | arm64-v8a | ${{ env.APK_ARM64_SHA }} |

          files: QuickNovel-arm64-v8a-r${{ env.COMMIT_COUNT }}.apk

          draft: ${{ github.event.inputs.dry-run != '' }}

          prerelease: false

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
