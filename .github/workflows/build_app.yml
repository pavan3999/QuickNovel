name: Build App

on:
  # Manual triggers
  workflow_dispatch:
    inputs:
      git-ref:
        description: Git Ref (Optional)
        required: false
      dry-run:
        description: Creates a draft release
        required: false

jobs:
  build:
    name: Build app
    runs-on: ubuntu-latest

    steps:
      - name: Cancel previous runs
        uses: styfle/cancel-workflow-action@0.13.1
        with:
          access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Clone Repository (Latest)
        uses: actions/checkout@v7
        if: github.event.inputs.git-ref == ''
        with:
          repository: 'LagradOst/QuickNovel'
          fetch-depth: 0

      - name: Clone Repository (Custom Ref)
        uses: actions/checkout@v7
        if: github.event.inputs.git-ref != ''
        with:
          repository: 'LagradOst/QuickNovel'
          fetch-depth: 0
          ref: ${{ github.event.inputs.git-ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin

      - name: Get previous release
        id: last_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release list \
            --repo "${{ github.repository }}" \
            --exclude-drafts \
            --exclude-pre-releases \
            --limit 100 \
            --json tagName \
            --jq '[.[].tagName | select(test("^r[0-9]+$"))][0]'
          )

          echo "Found preview tag: $TAG"

          echo "tag_name=${TAG:-r0}" >> "$GITHUB_OUTPUT"

      - name: Debug previous release
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Previous tag: '${{ steps.last_release.outputs.tag_name }}'"

      - name: Prepare build metadata
        run: |
          set -e

          commit_count=$(git rev-list --count HEAD)
          echo "COMMIT_COUNT=$commit_count" >> "$GITHUB_ENV"

          current_sha=$(git rev-parse --short HEAD)
          echo "CURRENT_SHA=$current_sha" >> "$GITHUB_ENV"

          prev_tag="${{ steps.last_release.outputs.tag_name }}"
          prev_commit_count=$(echo "${prev_tag:-r0}" | sed -e 's/^r//')

          commit_count_diff=$((commit_count - prev_commit_count))
          if [ "$commit_count_diff" -lt 0 ]; then
            commit_count_diff=0
          fi

          prev_release_sha=$(git rev-parse --short HEAD~$commit_count_diff)
          echo "PREV_RELEASE_SHA=$prev_release_sha" >> "$GITHUB_ENV"

          echo "COMMIT_LOGS<<EOF" >> "$GITHUB_ENV"
          curl -s -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/LagradOst/QuickNovel/compare/$prev_release_sha...$current_sha" \
            | jq '[.commits[] | {message:(.commit.message | split("\n")), username:.author.login}]' \
            | jq -r '.[] | "- \(.message | first) (@\(.username))"' >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure ARM64 only
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/build.gradle")
          text = path.read_text()

          marker = "defaultConfig {"

          if marker not in text:
              raise SystemExit("Could not find defaultConfig")

          text = text.replace(
              marker,
              '''defaultConfig {
                  ndk {
                      abiFilters "arm64-v8a"
                  }''',
              1
          )

          path.write_text(text)

          print("Configured ARM64-v8a only")
          PY

      - name: Verify ARM64 configuration
        run: |
          grep -A8 -B2 'defaultConfig' app/build.gradle

      - name: Build Release
        run: ./gradlew assembleRelease

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > release.jks

      - name: Sign APK
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          APK="app/build/outputs/apk/release/app-release-unsigned.apk"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)

          echo "Using: $APKSIGNER"

          "$APKSIGNER" sign \
            --ks release.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out QuickNovel-arm64-v8a-r${{ env.COMMIT_COUNT }}.apk \
            "$APK"

      - name: Verify signed APK
        run: |
          set -e

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)

          "$APKSIGNER" verify --verbose \
            QuickNovel-arm64-v8a-r${{ env.COMMIT_COUNT }}.apk

          ls -lh QuickNovel-arm64-v8a-r${{ env.COMMIT_COUNT }}.apk

      - name: Calculate SHA-256
        run: |
          sha=$(sha256sum QuickNovel-arm64-v8a-r${{ env.COMMIT_COUNT }}.apk | awk '{ print $1 }')
          echo "APK_ARM64_SHA=$sha" >> "$GITHUB_ENV"

      - name: Delete keystore
        if: always()
        run: rm -f release.jks

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: r${{ env.COMMIT_COUNT }}
          name: QuickNovel Preview r${{ env.COMMIT_COUNT }}
          body: |
            ### Commits

            https://github.com/LagradOst/QuickNovel/compare/${{ env.PREV_RELEASE_SHA }}...${{ env.CURRENT_SHA }}

            ${{ env.COMMIT_LOGS }}

            ---

            ### Checksums

            | Variant   | SHA-256 |
            |-----------|----------|
            | arm64-v8a | ${{ env.APK_ARM64_SHA }} |

          files: QuickNovel-arm64-v8a-r${{ env.COMMIT_COUNT }}.apk
          draft: ${{ github.event.inputs.dry-run != '' }}
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
